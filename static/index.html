<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Web 6 AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #e0e0ff);
           
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .status {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(0,255,0,0.2);
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(0,255,0,0.3);
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>Media Web 6 AI</h1>
        <p>Your AI assistant for digital solutions</p>
        <div class="status">
            <span class="dot"></span>
            Backend is running
        </div>
        <div class="footer">
            © 2026 Media Web 6 Services
        </div>
    </div>
</body>
</html>
